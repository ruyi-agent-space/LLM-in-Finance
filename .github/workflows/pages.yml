name: Deploy finance network dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main after any queued refresh
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test desktop, mobile and offline export
        run: |
          python -m unittest discover -s tests -p 'test_radar*.py' -v
          python tests/test_dashboard_ui.py
          node --check study_planner_dashboard/app.js
          node --check study_planner_dashboard/radar.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: study_planner_dashboard
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for this attempt's Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fxc "$ARTIFACT_NAME" || true)
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become ready."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
